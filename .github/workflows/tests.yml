name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # The tests read the live site, so run weekly to catch changes made there.
    - cron: "0 12 * * 1"

jobs:
  emulated:
    name: pytest (Chrome, Pixel 7 emulation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run tests
        run: |
          set -o pipefail
          mkdir -p reports
          pytest --target emulated --headless | tee reports/pytest-output.txt

      - name: Result summary
        if: always()
        run: |
          {
            echo "## Test result"
            echo
            echo '```'
            tail -n 1 reports/pytest-output.txt
            grep '^FAILED' reports/pytest-output.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML report (zip)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: reports/
          if-no-files-found: ignore

      - name: Prepare report for GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        run: |
          mkdir -p site
          cp reports/report.html site/index.html

      - name: Upload report for GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  publish-report:
    name: Publish report to GitHub Pages
    # Only the latest run on main is published. Pull requests keep the zip artifact.
    if: always() && github.ref == 'refs/heads/main' && needs.emulated.result != 'cancelled' && needs.emulated.result != 'skipped'
    needs: emulated
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
