name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # The tests read the live site, so run weekly to catch changes made there.
    - cron: "0 12 * * 1"

jobs:
  emulated:
    name: pytest (Chrome, Pixel 7 emulation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run tests
        run: |
          set -o pipefail
          mkdir -p reports
          pytest --target emulated --headless | tee reports/pytest-output.txt

      - name: Result summary
        if: always()
        run: |
          {
            echo "## Test result"
            echo
            echo '```'
            tail -n 1 reports/pytest-output.txt
            grep '^FAILED' reports/pytest-output.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Also used by the "Publish report" workflow, which puts the report on GitHub Pages.
      - name: Upload HTML report (zip)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: reports/
          if-no-files-found: ignore
